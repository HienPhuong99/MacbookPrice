name: Quét giá MacBook hằng ngày
on:
  schedule:
    - cron: '30 2 * * *'   # 9:30 sáng giờ Việt Nam (GitHub có thể trễ vài phút)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scan_shops.py   # tự quét shop có JSON; lỗi thì vẫn dùng dữ liệu sheet
        continue-on-error: true
      - run: python3 .github/scan.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Quét giá $(TZ=Asia/Ho_Chi_Minh date '+%d/%m/%Y %H:%M')" && git push)
